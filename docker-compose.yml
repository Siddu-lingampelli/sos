services:
  postgres:
    image: postgres:16-alpine
    container_name: silentsos-postgres
    environment:
      POSTGRES_USER: silentsos
      POSTGRES_PASSWORD: silentsos
      POSTGRES_DB: silentsos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silentsos -d silentsos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: silentsos-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://silentsos:silentsos@postgres:5432/silentsos
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: silentsos-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres-data:
